# URL base del API Gateway (nginx). TODAS las peticiones HTTP y el WebSocket
# de tracking pasan por aqui; el gateway enruta por prefijo a cada microservicio:
#   /login /register /confirm /refresh /logout /session -> login
#   /books /formats /cloud-concepts /soap               -> books
#   /users /roles                                       -> users
#   /authors                                            -> authors
#   /pedidos /inventario                                -> pedidos
#   /pagos                                              -> pagos
#   /envios  y  ws://.../ws                             -> tracking
# Se puede sobrescribir con la variable de entorno EG4_GATEWAY_URL
# o con -Dgateway.url=... al lanzar la app.
gateway.url=http://34.51.84.143:8080/catalogo/api

# Segundos de espera de cada peticion HTTP
http.timeout.seconds=20

# User-Agent del mapa (OpenStreetMap bloquea tiles sin un User-Agent propio)
map.user.agent=EG4-LibraryDesktop/1.0 (JavaFX WebView; proyecto escolar EG4)
